name: Build apps
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: Windows
            sep: ";"
            flags: "--onefile"
          - os: macos-latest
            name: Mac-AppleSilicon
            sep: ":"
            flags: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow pyinstaller
      - name: Build
        shell: bash
        run: >
          pyinstaller --windowed ${{ matrix.flags }} --name DiveBarClock
          --add-data "Freya.ttf${{ matrix.sep }}."
          --add-data "BOTTLE.png${{ matrix.sep }}."
          dive_bar_clock.py
      - name: Zip (Mac)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/DiveBarClock.app DiveBarClock-${{ matrix.name }}.zip
      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive dist/DiveBarClock.exe DiveBarClock-${{ matrix.name }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: DiveBarClock-${{ matrix.name }}
          path: DiveBarClock-${{ matrix.name }}.zip
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: DiveBarClock-${{ matrix.name }}.zip
